[colors]
background = #222226
background-alt = #373B41
foreground = #C5C8C6
primary = #1C98E8
secondary = #387CD3
ternary = #3D97E2
alert = #A54242
disabled = #707880

[settings]
screenchange-reload = true
pseudo-transparency = true

[bar-base]
width = 100%
height = 25pt
radius = 6

dpi = 65

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 2

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "Ubuntu Sans Mono:size=13;0"
font-1 = "JetBrainsMono Nerd Font Mono:size=20;2"
font-2 = "Roboto:size=11:weight=bold;2"
font-3 = "Tamsyn:pixelsize=12;0

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
